<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三国塔防 · 虎牢关之战</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="hud">
      <span class="hud-title">虎牢关之战</span>
      <span class="hud-item">军粮 <b id="gold">0</b></span>
      <span class="hud-item">城池 <b id="hp">0</b></span>
      <span class="hud-item">波次 <b id="wave">0</b>/<b id="waveTotal">0</b></span>
      <button id="startBtn" class="btn">出战</button>
      <span class="skillbar">
        <button id="skillFire" class="skill-btn" data-skill="fire">
          <span class="sk-name">火计</span><span class="sk-cd"></span>
        </button>
        <button id="skillFort" class="skill-btn" data-skill="fort">
          <span class="sk-name">空城计</span><span class="sk-cd"></span>
        </button>
      </span>
      <span id="speedHint" class="hud-hint"></span>
    </header>

    <div id="stage">
      <canvas id="game" width="960" height="600"></canvas>

      <aside id="shop">
        <h3>布阵 · 蜀</h3>
        <button class="tower-btn" data-hero="liubei">
          <span class="tw-name">刘备 <i class="tw-fac">弓</i></span>
          <span class="tw-desc">主公 · 远程单体</span>
          <span class="tw-cost">军粮 60</span>
        </button>
        <button class="tower-btn" data-hero="guanyu">
          <span class="tw-name">关羽 <i class="tw-fac">弓</i></span>
          <span class="tw-desc">单体 · 射速快</span>
          <span class="tw-cost">军粮 50</span>
        </button>
        <button class="tower-btn" data-hero="zhangfei">
          <span class="tw-name">张飞 <i class="tw-fac">枪</i></span>
          <span class="tw-desc">高伤 · 近程单体</span>
          <span class="tw-cost">军粮 70</span>
        </button>
        <button class="tower-btn" data-hero="zhugeliang">
          <span class="tw-name">诸葛亮 <i class="tw-fac">谋</i></span>
          <span class="tw-desc">火攻 · 范围溅射</span>
          <span class="tw-cost">军粮 100</span>
        </button>

        <div id="bondPanel" class="bond-panel">
          <div class="bond-title">羁绊</div>
          <div id="bondList" class="bond-list">未激活</div>
        </div>

        <div id="selInfo" class="sel-info">点击空地选择塔位</div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-card">
        <h2 id="ovTitle">三国塔防</h2>
        <p id="ovText">守住虎牢关，击退董卓大军！</p>
        <button id="ovBtn" class="btn">开始</button>
      </div>
    </div>
  </div>

  <script src="sprites.js"></script>
  <script src="game.js"></script>
</body>
</html>
