<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>三国塔防 · 虎牢关之战</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="hud">
      <span class="hud-title">虎牢关之战</span>
      <span class="hud-item">军粮 <b id="gold">0</b></span>
      <span class="hud-item">城池 <b id="hp">0</b></span>
      <span class="hud-item">波次 <b id="wave">0</b>/<b id="waveTotal">0</b></span>
      <button id="startBtn" class="btn">出战</button>
      <span class="skillbar">
        <button id="skillFire" class="skill-btn" data-skill="fire">
          <span class="sk-name">火计</span><span class="sk-cd"></span>
        </button>
        <button id="skillFort" class="skill-btn" data-skill="fort">
          <span class="sk-name">空城计</span><span class="sk-cd"></span>
        </button>
      </span>
      <button id="pauseBtn" class="btn btn-sm">暂停</button>
      <button id="speedBtn" class="btn btn-sm">1x</button>
      <button id="menuBtn" class="btn btn-sm">菜单</button>
      <span id="speedHint" class="hud-hint"></span>
    </header>

    <div id="stage">
      <canvas id="game" width="960" height="600"></canvas>

      <aside id="shop">
        <h3>招贤馆 · 蜀</h3>
        <button id="recruitBtn" class="recruit-btn">
          <span class="rc-label">招贤</span>
          <span class="rc-cost" id="recruitCost">军粮 30</span>
        </button>
        <div id="candidates" class="candidates"></div>

        <div id="bondPanel" class="bond-panel">
          <div class="bond-title">羁绊</div>
          <div id="bondList" class="bond-list">未激活</div>
        </div>

        <div id="selInfo" class="sel-info">点击「招贤」抽取武将</div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-card">
        <h2 id="ovTitle">三国塔防</h2>
        <p id="ovText">守住虎牢关，击退董卓大军！</p>
        <div id="menuList" class="menu-list hidden"></div>
        <div class="overlay-btns">
          <button id="ovBtn" class="btn">开始</button>
          <button id="codexBtn" class="btn btn-ghost hidden">图鉴</button>
          <button id="ovBtn2" class="btn btn-ghost hidden">返回主菜单</button>
        </div>
      </div>
    </div>

    <div id="codex" class="overlay hidden">
      <div class="overlay-card codex-card">
        <h2>图鉴</h2>
        <h3 class="codex-h">武将</h3>
        <div id="codexHeroes" class="codex-list"></div>
        <h3 class="codex-h">羁绊</h3>
        <div id="codexBonds" class="codex-list"></div>
        <button id="codexClose" class="btn">返回</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="sprites.js"></script>
  <script src="game.js"></script>
</body>
</html>
